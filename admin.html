<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - Buarcos & Sea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-md p-8">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900">Painel de Controlo & Configurações</h1>
            <a href="index.html" class="text-xs bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg font-semibold transition-colors">Voltar ao Site</a>
        </div>

        <form id="admin-form" onsubmit="guardarConfiguracoes(event)" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Taxas Globais por Estadia -->
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-4 text-sm uppercase tracking-wider">Taxa de Limpeza por Estadia</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Cristal Mar (€)</label>
                            <input type="number" id="limpeza-cristal" step="0.5" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tonay Sol (€)</label>
                            <input type="number" id="limpeza-tonay" step="0.5" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white" required>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-4 text-sm uppercase tracking-wider">Taxa de Animais (Pet) por Estadia</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Valor por Animal / Estadia (€)</label>
                            <input type="number" id="pet-estadia" step="0.5" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white" required>
                            <p class="text-[11px] text-slate-500 mt-1">Aplicado por cada animal de estimação durante toda a estadia.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-4 flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow text-sm cursor-pointer">
                    Guardar Configurações
                </button>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        async function carregarConfiguracoes() {
            try {
                const res = await fetch('/api/precos');
                const json = await res.json();
                if (json.success) {
                    if (json.limpezaGlobal) {
                        document.getElementById('limpeza-cristal').value = json.limpezaGlobal.cristal_mar || 35;
                        document.getElementById('limpeza-tonay').value = json.limpezaGlobal.tonay_sol || 35;
                    }
                    if (json.petGlobal !== undefined) {
                        document.getElementById('pet-estadia').value = json.petGlobal;
                    } else {
                        document.getElementById('pet-estadia').value = 15; // Valor predefinido
                    }
                }
            } catch(err) {
                document.getElementById('limpeza-cristal').value = 35;
                document.getElementById('limpeza-tonay').value = 35;
                document.getElementById('pet-estadia').value = 15;
            }
        }

        async function guardarConfiguracoes(e) {
            e.preventDefault();
            const limpezaCristal = parseFloat(document.getElementById('limpeza-cristal').value);
            const limpezaTonay = parseFloat(document.getElementById('limpeza-tonay').value);
            const petEstadia = parseFloat(document.getElementById('pet-estadia').value);

            try {
                const res = await fetch('/api/precos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        limpezaGlobal: { cristal_mar: limpezaCristal, tonay_sol: limpezaTonay },
                        petGlobal: petEstadia
                    })
                });
                const json = await res.json();
                if (json.success) {
                    alert('Configurações guardadas com sucesso!');
                } else {
                    alert('Erro ao guardar configurações.');
                }
            } catch(err) {
                alert('Erro de ligação ao servidor.');
            }
        }

        window.addEventListener('DOMContentLoaded', carregarConfiguracoes);
    </script>
</body>
</html>
