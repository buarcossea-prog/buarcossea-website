<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Avançada - Buarcos & Sea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Conteúdo do Painel ABERTO Diretamente (Sem Login) -->
    <div id="painel-conteudo" class="w-full max-w-4xl mx-auto py-10 space-y-8">
        
        <header class="bg-slate-950 border border-slate-800 text-white shadow-md rounded-2xl px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-sky-600 text-white p-2.5 rounded-xl">
                    <i data-lucide="sliders" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-lg font-bold tracking-tight block leading-tight">Painel de Controlo & Tarifas</span>
                    <span class="text-xs text-sky-400 font-medium tracking-wide uppercase">Buarcos & Sea • Gestão de Alojamento</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Ver Site
                </a>
            </div>
        </header>

        <!-- 1. Gestão por Período (Preços Diários, Pets e Bloqueios) -->
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="calendar-range" class="w-5 h-5 text-sky-400"></i> Configurar Intervalo de Datas (Preços e Bloqueios)
            </h3>

            <form onsubmit="salvarIntervalo(event)" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Alojamento</label>
                        <select id="select-apt" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500">
                            <option value="cristal_mar">Cristal Mar (161145/AL)</option>
                            <option value="tonay_sol">Tonay Sol (146454/AL)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Data Inicial</label>
                        <input type="date" id="data-inicio" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Data Final</label>
                        <input type="date" id="data-fim" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-slate-700/60">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Preço Noite (€)</label>
                        <input type="number" id="valor-diaria" min="0" placeholder="Ex: 85" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 font-bold">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Taxa Pet / Noite (€)</label>
                        <input type="number" id="valor-pet" min="0" placeholder="Ex: 10" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Desconto Extra (%)</label>
                        <input type="number" id="valor-desconto-extra" min="0" max="100" placeholder="Ex: 15" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 text-emerald-400 font-bold">
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-slate-700/60">
                    <label class="inline-flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="check-bloqueado" class="w-5 h-5 accent-red-600 rounded">
                        <span class="text-sm font-semibold text-red-400">Bloquear datas no calendário (Indisponível)</span>
                    </label>

                    <div class="flex-1 max-w-xs">
                        <input type="text" id="nota-epoca" placeholder="Nota interna (Ex: Época Alta / Verão)" class="w-full bg-slate-900 border border-slate-700 text-slate-300 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-700 flex items-center justify-between">
                    <span id="msg-status" class="text-xs font-medium hidden"></span>
                    <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-6 py-3 rounded-xl transition-all shadow text-sm flex items-center gap-2 cursor-pointer ml-auto">
                        <i data-lucide="save" class="w-4 h-4"></i> Guardar Intervalo de Datas
                    </button>
                </div>
            </form>
        </div>

        <!-- 2. Configurações Globais por Estadia (Taxa de Limpeza Fixa) -->
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="settings" class="w-5 h-5 text-emerald-400"></i> Taxa de Limpeza Global por Estadia
            </h3>
            <p class="text-slate-400 text-xs">Defina o valor fixo da taxa de limpeza cobrada por estadia em cada apartamento, independentemente do número de noites.</p>

            <form onsubmit="salvarLimpezaGlobal(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Cristal Mar - Limpeza (€)</label>
                        <input type="number" id="limpeza-cristal" min="0" value="35" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Tonay Sol - Limpeza (€)</label>
                        <input type="number" id="limpeza-tonay" min="0" value="35" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 font-bold">
                    </div>
                </div>
                <div class="pt-2 flex items-center justify-between">
                    <span id="msg-status-limpeza" class="text-xs font-medium hidden"></span>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition-all shadow text-sm flex items-center gap-2 cursor-pointer ml-auto">
                        <i data-lucide="check" class="w-4 h-4"></i> Atualizar Taxas de Limpeza
                    </button>
                </div>
            </form>
        </div>

    </div>

    <script>
        lucide.createIcons();

        async function salvarIntervalo(e) {
            e.preventDefault();
            const apt = document.getElementById('select-apt').value;
            const dInicio = new Date(document.getElementById('data-inicio').value);
            const dFim = new Date(document.getElementById('data-fim').value);
            const preco = document.getElementById('valor-diaria').value;
            const pet = document.getElementById('valor-pet').value;
            const descontoExtra = document.getElementById('valor-desconto-extra').value;
            const bloqueado = document.getElementById('check-bloqueado').checked;
            const nota = document.getElementById('nota-epoca').value;
            const status = document.getElementById('msg-status');

            if (dFim < dInicio) {
                alert("A data final deve ser igual ou posterior à data inicial.");
                return;
            }

            let datas = [];
            let dt = new Date(dInicio);
            while (dt <= dFim) {
                datas.push(dt.toISOString().split('T')[0]);
                dt.setDate(dt.getDate() + 1);
            }

            status.className = "text-xs font-medium text-sky-400";
            status.innerText = "A guardar dados...";
            status.classList.remove('hidden');

            try {
                const res = await fetch('/api/precos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        acao: 'salvar_datas',
                        alojamento: apt, 
                        datas, 
                        preco, 
                        pet: pet ? Number(pet) : 0,
                        descontoExtra: descontoExtra ? Number(descontoExtra) : 0,
                        bloqueado,
                        nota
                    })
                });

                const data = await res.json();
                if (data.success) {
                    status.className = "text-xs font-medium text-emerald-400 flex items-center gap-1";
                    status.innerText = "✓ Configurações de datas guardadas com sucesso!";
                } else {
                    status.className = "text-xs font-medium text-red-400";
                    status.innerText = "Erro ao guardar.";
                }
            } catch (err) {
                status.className = "text-xs font-medium text-red-400";
                status.innerText = "Erro de ligação ao servidor.";
            }
        }

        async function salvarLimpezaGlobal(e) {
            e.preventDefault();
            const limpezaCristal = document.getElementById('limpeza-cristal').value;
            const limpezaTonay = document.getElementById('limpeza-tonay').value;
            const status = document.getElementById('msg-status-limpeza');

            status.className = "text-xs font-medium text-sky-400";
            status.innerText = "A atualizar taxas de limpeza...";
            status.classList.remove('hidden');

            try {
                const res = await fetch('/api/precos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        acao: 'salvar_limpeza',
                        limpezaCristal: Number(limpezaCristal),
                        limpezaTonay: Number(limpezaTonay)
                    })
                });

                const data = await res.json();
                if (data.success) {
                    status.className = "text-xs font-medium text-emerald-400 flex items-center gap-1";
                    status.innerText = "✓ Taxas de limpeza atualizadas com sucesso!";
                } else {
                    status.className = "text-xs font-medium text-red-400";
                    status.innerText = "Erro ao atualizar.";
                }
            } catch (err) {
                status.className = "text-xs font-medium text-red-400";
                status.innerText = "Erro de ligação ao servidor.";
            }
        }
    </script>
</body>
</html>
